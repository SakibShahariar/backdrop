[package]
name = "backdrop"
version = "0.1.0"
edition = "2021"

[dependencies]
gtk = { package = "gtk4", version = "0.7", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.5", features = ["v1_4"] }
glib = "0.18"
gio = "0.18"
gdk = { package = "gdk4", version = "0.7", features = ["v4_12"] }
gsk = { package = "gsk4", version = "0.7", features = ["v4_6"] }
graphene = { package = "graphene-rs", version = "0.18" }

[[bin]]
name = "backdrop"
path = "src/main.rs"
